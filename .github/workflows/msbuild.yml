name: Windows Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  TRIPLET: x64-windows

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.1
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtcharts qtconnectivity qtserialbus qtserialport qtwebsockets
          cache: true
          use-official: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: latest
          ninjaVersion: latest

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone --depth=1 --branch 2026.06.01 https://github.com/microsoft/vcpkg.git "${{ github.workspace }}/.vcpkg"
          & "${{ github.workspace }}/.vcpkg/bootstrap-vcpkg.bat"

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = "${{ github.workspace }}/.vcpkg/vcpkg.exe"
          & $vcpkg install curl:${env:TRIPLET}
          & $vcpkg install dlfcn-win32:${env:TRIPLET}
          & $vcpkg install expat:${env:TRIPLET}
          & $vcpkg install mosquitto:${env:TRIPLET}
          & $vcpkg install openssl:${env:TRIPLET}
          & $vcpkg install pthreads:${env:TRIPLET}

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} -DVCPKG_TARGET_TRIPLET=${{ env.TRIPLET }} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\.vcpkg\scripts\buildsystems\vcpkg.cmake -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl "-DCMAKE_CXX_FLAGS=/W3 /WX-"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_CONFIGURATION }} --parallel

      - name: Install
        shell: pwsh
        run: |
          cmake --install build --config ${{ env.BUILD_CONFIGURATION }} --prefix "${{ github.workspace }}/staging"

      # The install runs windeployqt (VSCPWORKS_DEPLOY_RUNTIME); add the
      # DLLs of the vcpkg libraries (mosquitto, curl, OpenSSL, expat,
      # pthreads, dlfcn) so the program runs without them installed
      - name: Add vcpkg runtime DLLs
        shell: pwsh
        run: |
          Copy-Item "${{ github.workspace }}/.vcpkg/installed/${{ env.TRIPLET }}/bin/*.dll" "${{ github.workspace }}/staging/bin/"
          Get-ChildItem "${{ github.workspace }}/staging/bin" -Filter *.dll | Select-Object -ExpandProperty Name

      - name: Pack install tree
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ github.workspace }}/staging/*" -DestinationPath "${{ github.workspace }}/vscp-works-qt-windows-install.zip"

      - name: Write SHA256SUMS
        id: sha256sums_89
        continue-on-error: true
        shell: bash
        run: |
          bash .github/scripts/write-sha256sums.sh "SHA256SUMS-vscp-works-qt-windows-install" <<'SHA256SUMS_PATTERNS'
          ${{ github.workspace }}/vscp-works-qt-windows-install.zip
          SHA256SUMS_PATTERNS

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscp-works-qt-windows-install
          path: |
            ${{ github.workspace }}/vscp-works-qt-windows-install.zip
            ${{ steps.sha256sums_89.outputs.file }}
