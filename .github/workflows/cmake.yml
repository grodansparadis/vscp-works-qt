name: Linux Build

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
          - os: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64

    steps:

      # https://github.com/actions/checkout
    - uses: actions/checkout@v4

    - name: Checkout eclipse paho repo
      uses: actions/checkout@v4
      with:
        repository: eclipse/paho.mqtt.c
        path: paho

    - name: Install Linux system dependencies
      run: |
        for attempt in 1 2 3; do
          if sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y \
            build-essential libgl1-mesa-dev libgstreamer-gl1.0-0 libpulse-dev \
            libxcb-glx0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb1 libxkbcommon-dev \
            libxkbcommon-x11-0 libxcb-xkb-dev libxcb-cursor0 \
            libmosquitto-dev libexpat-dev libssl-dev libcurl4-openssl-dev libfuse2 libsqlite3-dev; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Package installation failed (attempt $attempt/3); retrying in 20 seconds."
            sleep 20
          fi
        done
        exit 1

      # https://github.com/marketplace/actions/install-qt
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 6.8.1
        host: ${{ matrix.qt_host }}
        target: 'desktop'
        arch: ${{ matrix.qt_arch }}
        modules: 'qtcharts qtconnectivity qtserialbus qtserialport qtwebsockets'
        install-deps: false

#    - name: Install paho manually
#      run: cd paho && mkdir build && cd build && sudo cmake -DPAHO_WITH_SSL=true .. && sudo make install
       
    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2
    
    - name: Create Build Environment
      run: |
        mkdir build && cd build
        cmake  -DCMAKE_BUILD_TYPE=Release  -DCMAKE_INSTALL_PREFIX=/usr ..

    - name: Build vscp-works-qt
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: |
        make -j$(nproc)
        make install DESTDIR=AppDir
