name: AppImage

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    # Build on the oldest supported distribution: an AppImage only runs on
    # systems with the same or a newer glibc than the build system
    # (ubuntu-latest made it need glibc 2.43, which even Debian 13 lacks)
    runs-on: ubuntu-22.04
    #continue-on-error: true

    steps:
    # https://github.com/actions/checkout  
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        for attempt in 1 2 3; do
          if sudo apt-get update && sudo apt-get install -y \
            libmosquitto-dev libexpat-dev libssl-dev libcurl4-openssl-dev libfuse2; then
            exit 0
          fi
          if [ "$attempt" -lt 3 ]; then
            echo "Package installation failed (attempt $attempt/3); retrying in 20 seconds."
            sleep 20
          fi
        done
        exit 1

    # https://github.com/marketplace/actions/install-qt 
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        aqtversion: '==3.1.*'
        version: '6.11.1'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtcharts qtconnectivity qtserialbus qtserialport'

    - name: Setup cmake
      uses: jwlawson/actions-setup-cmake@v2

    - name: Create Build Environment
      run: |
        mkdir build && cd build
        cmake  -DCMAKE_BUILD_TYPE=Release  -DCMAKE_INSTALL_PREFIX=/usr ..

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: |
        make -j$(nproc)
        make install DESTDIR=AppDir
    
    - name: get linuxdeploy
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Install files
      run: wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
    
    - name: get qt plugin
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Install files
      run: wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
  
    - name: Make appimage files executable
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Install files
      run: chmod +x linuxdeploy*.AppImage

    - name: prepare AppRun
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Prepare content not installed by cmake (AppRun)
      run: |
        cp ../install/AppRun AppDir
        chmod a+x AppDir/AppRun
        cp ../install/vscp-works-qt.desktop AppDir
        cp ../icons/vscpworks.png AppDir
    
    - name: prepare desktop/icon
      working-directory: ${{github.workspace}}/build
      shell: bash
      # Prepare content not installed by cmake (desktop/icon)
      run: cp ../install/vscp-works-qt.desktop ./AppDir/  && cp ../icons/vscpworks.png ./AppDir/ 
  
    - name: build appimage
      working-directory: ${{github.workspace}}/build
      shell: bash
      # initialize AppDir, bundle shared libraries for QtQuickApp, use Qt plugin to bundle additional resources, and build AppImage, all in one single command
      # https://forum.qt.io/topic/154845/libmimerapi-so-not-found/4
      env:
        LDAI_OUTPUT: vscpworks-x86_64.AppImage
        OUTPUT: vscpworks-x86_64.AppImage
      run: ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage  

    - name: Write SHA256SUMS
      id: sha256sums_110
      continue-on-error: true
      shell: bash
      run: |
        bash .github/scripts/write-sha256sums.sh "SHA256SUMS-vscp-works-qt" <<'SHA256SUMS_PATTERNS'
        ${{github.workspace}}/build/vscpworks*.AppImage
        SHA256SUMS_PATTERNS

    - uses: actions/upload-artifact@v4
      with:
        name: vscp-works-qt
        path: |
          ${{github.workspace}}/build/vscpworks*.AppImage
          ${{ steps.sha256sums_110.outputs.file }}
