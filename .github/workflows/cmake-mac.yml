name: CMake-Mac

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.11.1
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts qtconnectivity qtserialbus qtserialport qtwebsockets

      - name: Install system dependencies
        run: |
          brew update
          brew install expat mosquitto openssl@3 ninja

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${BUILD_TYPE} \
            -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)

      - name: Build
        run: cmake --build build --config ${BUILD_TYPE} --parallel

      # The install runs macdeployqt (VSCPWORKS_DEPLOY_RUNTIME), which puts
      # the Qt frameworks and the Homebrew libraries into the app bundle
      - name: Install
        run: |
          cmake --install build --config ${BUILD_TYPE} --prefix "${{ github.workspace }}/staging"
          ls "${{ github.workspace }}/staging/vscp-works-qt.app/Contents/Frameworks" | head -40

      - name: Pack install tree
        run: |
          tar -C "${{ github.workspace }}" -czf "${{ github.workspace }}/vscp-works-qt-macos-install.tar.gz" staging

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscp-works-qt-macos-install
          path: ${{ github.workspace }}/vscp-works-qt-macos-install.tar.gz
